services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cs_agent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cs_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs_agent_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cs_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cs_agent} -d ${POSTGRES_DB:-cs_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cs_agent_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
