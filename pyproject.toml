[project]
name = "vertical-cs-agent"
version = "0.1.0"
description = "Vertical Customer Service Agent (Phase 1: LangGraph Agent Loop, Layered Memory, Tool Calling)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jieba>=0.42.1",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.3.0",
    "langfuse>=2.50.0",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.10",
    "pgvector>=0.3.6",
    "psycopg[binary,pool]>=3.2.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.26.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]
